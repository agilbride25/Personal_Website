<!DOCTYPE html>

<head>

    <!-- Inline button styles (applied directly in index.html) -->
    <style>
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 920px;
            margin: 0 auto;
            z-index: 2;
            align-items: center;
            justify-items: center;
        }

        .buttons-grid .btn {
            width: 240px;
            height: 64px;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            /* typography */
            font-weight: 700;                 /* bold */
            font-size: 1.125rem;              /* slightly larger font */
            color: #6c757d !important;        /* grey text */

            /* appearance */
            background-color: #ffffff !important;    /* white background */
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;                      /* rounded edges */

            /* polish */
            box-shadow: 0 6px 14px rgba(0,0,0,0.06);
            transition: transform .18s ease, box-shadow .18s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .buttons-grid .btn:hover,
        .buttons-grid .btn:focus {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
            z-index: 3;
        }

        @media (max-width: 575.98px) {
            .buttons-grid {
                grid-template-columns: 1fr;
                max-width: 420px;
                padding: 0 1rem;
            }
            .buttons-grid .btn {
                width: 100%;
                height: 56px;
                font-size: 1.025rem; /* slightly smaller on narrow screens */
            }
        }
    </style>
</head>
