<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clustal‑Omega Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .pane { border: 1px solid #e3e3e3; padding: 1rem; border-radius: 6px; background: #fff; }
    .layout { display: grid; grid-template-columns: 1fr 320px 1fr; gap: 1rem; align-items: start; }
    textarea { width: 100%; min-height: 300px; font-family: monospace; }
  </style>
</head>
<body>
  <header class="topnav">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('static', filename='index.html') }}">Austin Gilbride</a>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <h1 class="mb-3">Clustal‑Omega Web (in-page)</h1>
    <p class="text-muted">Paste FASTA or enter UniProt/PDB IDs (one per line), choose options, and run alignment — results show on this page.</p>

    <div class="layout mb-4">
      <!-- Input pane -->
      <div class="pane">
        <h5>Input (FASTA or IDs)</h5>
        <textarea id="inputText" placeholder="Paste FASTA or list UniProt/PDB IDs (one per line)"></textarea>
        <div class="mt-2">
          <label class="form-label">Or upload FASTA</label>
          <input id="fileInput" type="file" accept=".fa,.fasta,.txt" class="form-control">
        </div>
      </div>

      <!-- Options pane -->
      <div class="pane">
        <h5>Options</h5>
        <div class="mb-2">
          <label class="form-label">Output format</label>
          <select id="outfmt" class="form-select">
            <option value="clustal">clustal</option>
            <option value="fasta">fasta</option>
            <option value="stockholm">stockholm</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Extra clustalo options</label>
          <input id="extraOpts" class="form-control" placeholder="e.g. --threads=2">
        </div>
        <div class="d-grid gap-2 mt-3">
          <button id="runBtn" class="btn btn-primary">Run alignment</button>
          <button id="clearBtn" class="btn btn-outline-secondary">Clear</button>
        </div>

        <div class="mt-3">
          <div id="status" class="text-muted small">Idle</div>
        </div>
      </div>

      <!-- Output pane -->
      <div class="pane">
        <h5>Output (first lines)</h5>
        <pre id="outputPreview" style="min-height:140px; white-space:pre-wrap; background:#f8f9fa; padding:0.5rem; border-radius:4px;">No output yet.</pre>

        <h6 class="mt-3">Full alignment</h6>
        <textarea id="fullOutput" readonly placeholder="Full alignment will appear here"></textarea>

        <div class="mt-2 d-flex gap-2">
          <a id="downloadLink" class="btn btn-outline-primary" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">Download alignment</a>
          <button id="copyBtn" class="btn btn-sm btn-secondary" style="display:none;">Copy</button>
        </div>

        <div id="errorBox" class="mt-2 text-danger" style="display:none;"></div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">© Austin Gilbride</div>
  </footer>

  <script>
    const API_RUN = '/api/run';

    const runBtn = document.getElementById('runBtn');
    const clearBtn = document.getElementById('clearBtn');
    const inputText = document.getElementById('inputText');
    const fileInput = document.getElementById('fileInput');
    const outfmt = document.getElementById('outfmt');
    const extraOpts = document.getElementById('extraOpts');
    const status = document.getElementById('status');
    const outputPreview = document.getElementById('outputPreview');
    const fullOutput = document.getElementById('fullOutput');
    const downloadLink = document.getElementById('downloadLink');
    const errorBox = document.getElementById('errorBox');
    const copyBtn = document.getElementById('copyBtn');

    clearBtn.addEventListener('click', () => {
      inputText.value = '';
      fileInput.value = '';
      outputPreview.textContent = 'No output yet.';
      fullOutput.value = '';
      downloadLink.style.display = 'none';
      errorBox.style.display = 'none';
      status.textContent = 'Idle';
    });

    runBtn.addEventListener('click', async () => {
      status.textContent = 'Running...';
      errorBox.style.display = 'none';
      downloadLink.style.display = 'none';
      copyBtn.style.display = 'none';
      outputPreview.textContent = 'Running...';
      fullOutput.value = '';

      const fd = new FormData();
      fd.append('outfmt', outfmt.value);
      fd.append('extra_opts', extraOpts.value || '');

      if (fileInput.files.length > 0) {
        fd.append('file', fileInput.files[0]);
      } else if (inputText.value.trim()) {
        fd.append('input_text', inputText.value.trim());
      } else {
        errorBox.textContent = 'Provide input (FASTA/IDs) or upload a FASTA file.';
        errorBox.style.display = 'block';
        status.textContent = 'Idle';
        outputPreview.textContent = 'No output yet.';
        return;
      }

      try {
        const resp = await fetch(API_RUN, {
          method: 'POST',
          body: fd
        });
        if (!resp.ok) {
          const err = await resp.json().catch(()=>({error: 'Unknown error'}));
          throw new Error(err.error || `${resp.status} ${resp.statusText}`);
        }
        const data = await resp.json();
        const aligned = data.aligned || '';
        const download_url = data.download_url || '#';

        const lines = aligned.split(/\r?\n/).slice(0, 40).join('\n');
        outputPreview.textContent = lines || '(empty)';

        fullOutput.value = aligned;
        downloadLink.href = download_url;
        downloadLink.style.display = 'inline-block';
        copyBtn.style.display = 'inline-block';
        status.textContent = 'Finished';
        errorBox.style.display = 'none';
      } catch (err) {
        errorBox.textContent = err.message || 'Error running alignment';
        errorBox.style.display = 'block';
        outputPreview.textContent = 'Error';
        status.textContent = 'Error';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(fullOutput.value);
        copyBtn.textContent = 'Copied';
        setTimeout(()=> copyBtn.textContent = 'Copy', 1500);
      } catch {
        copyBtn.textContent = 'Failed';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
